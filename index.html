<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuck You Ramez</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at center, #1b281c 0%, #111a12 100%);
  color: white;
  text-align: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
h2 {
  color: #ffd34d;
  margin: 5px 0 10px 0;
  font-size: 26px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
#info {
  font-size: 18px;
  padding: 6px 15px;
  background: rgba(0,0,0,0.3);
  border-radius: 20px;
  margin-bottom: 8px;
  display: inline-block;
  border: 1px solid rgba(197, 166, 75, 0.3);
}
.game-container {
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #c5a64b;
  background: #000;
}
canvas {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  touch-action: manipulation;
  cursor: crosshair;
}
.controls-row {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}
button {
  padding: 10px 20px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(to bottom, #ffd34d, #e0b330);
  color: #17231a;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  transition: transform 0.1s ease, filter 0.2s;
}
button:active {
  transform: scale(0.95);
}
button:hover {
  filter: brightness(1.1);
}
.custom-msg-box {
  margin-top: 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
}
.custom-msg-box label {
  font-size: 14px;
  color: #ffd34d;
}
.custom-msg-box input {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #c5a64b;
  background: #111a12;
  color: #fff;
  font-size: 14px;
  width: 250px;
  outline: none;
}
#message {
  font-size: 20px;
  color: #ffe16b;
  min-height: 35px;
  font-weight: bold;
  margin-top: 8px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<h2>🎯 Fuck You Ramez 🔥</h2>

<div id="info">الأعداء المتبقون: <span id="left">3</span> / 3 | النقاط: <span id="score">0</span></div>

<div class="game-container">
  <canvas id="game" width="900" height="500"></canvas>
</div>

<div class="controls-row">
  <button id="fire">🔫 اضربي!</button>
  <button id="again">🔄 العبي تاني</button>
  <button id="toggleSound" style="background: #445c43; color: white;">🔊 الصوت: شغال</button>
</div>

<div class="custom-msg-box">
  <label for="victoryInput">رسالة الفوز:</label>
  <input type="text" id="victoryInput" value="Fuck You Ramez! إنتي أسطورة يا نوب!" placeholder="اكتبي رسالة الفوز هنا...">
</div>

<div id="message">صوّبي على الأهداف واضغطي عليها! 🎯</div>

<script>
// Web Audio API الأصوات التفاعلية
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playSound(type) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  if (type === 'shoot') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
    gainNode.gain.setValueAtTime(0.2, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.15);
  } else if (type === 'hit') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
    gainNode.gain.setValueAtTime(0.3, now);
    gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.2);
  } else if (type === 'win') {// لحن الانتصار البسيط
    const notes = [300, 400, 550, 700];
    notes.forEach((freq, idx) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);
      o.frequency.setValueAtTime(freq, now + idx * 0.1);
      g.gain.setValueAtTime(0.2, now + idx * 0.1);
      g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
      o.start(now + idx * 0.1);
      o.stop(now + idx * 0.1 + 0.2);
    });
  }
}

const c = document.getElementById("game"), ctx = c.getContext("2d");
const left = document.getElementById("left");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");
const victoryInput = document.getElementById("victoryInput");

let mx = 450, my = 220, score = 0, won = false, shots = [], effects = [], particles = [];
let enemies = [];
let screenShake = 0;

function newEnemies(){
  enemies = [
    {x: 250, y: 255, dx: 0.8, alive: true},
    {x: 450, y: 225, dx: -0.7, alive: true},
    {x: 660, y: 260, dx: 0.9, alive: true}
  ];
}

function reset(){
  score = 0; won = false; shots = []; effects = []; particles = []; newEnemies();
  message.textContent = "صوّبي على الأهداف واضغطي عليها! 🎯";
  update();
}

function update(){
  left.textContent = enemies.filter(e => e.alive).length;
  scoreText.textContent = score;
}

function person(x, y, player = false){
  ctx.save();
  ctx.translate(x, y);
  
  // ظل
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath(); ctx.ellipse(0, 3, 23, 7, 0, 0, Math.PI * 2); ctx.fill();
  
  // رجلين
  ctx.strokeStyle = "#282a25"; ctx.lineWidth = 10; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-7, -28); ctx.lineTo(-11, -3);
  ctx.moveTo(7, -28); ctx.lineTo(12, -3); ctx.stroke();
  
  // جسم ولبس
  ctx.fillStyle = player ? "#344c32" : "#51483a";
  ctx.fillRect(-15, -65, 30, 39);
  
  // ذراعين
  ctx.strokeStyle = "#b78c68"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-12, -57); ctx.lineTo(-22, -39);
  ctx.moveTo(12, -57); ctx.lineTo(23, -43); ctx.stroke();
  
  // الرأس
  ctx.fillStyle = "#bd916d";
  ctx.beginPath(); ctx.arc(0, -76, 12, 0, Math.PI * 2); ctx.fill();
  
  // خوذة
  ctx.fillStyle = player ? "#1a2b1a" : "#3b2f29";
  ctx.beginPath(); ctx.arc(0, -80, 13, Math.PI, Math.PI * 2); ctx.fill();
  
  // سلاح
  ctx.fillStyle = "#171a16"; ctx.fillRect(8, -49, 35, 6);
  ctx.fillRect(22, -43, 5, 12);
  
  ctx.restore();
}

function draw(){
  ctx.save();
  if (screenShake > 0) {
    screenShake--;
    let shakeX = (Math.random() - 0.5) * 10;
    let shakeY = (Math.random() - 0.5) * 10;
    ctx.translate(shakeX, shakeY);
  }

  // الخلفية
  ctx.fillStyle = "#9cae83"; ctx.fillRect(0, 0, 900, 500);
  ctx.fillStyle = "#788764";
  ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(250, 45);
  ctx.lineTo(500, 110); ctx.lineTo(720, 40); ctx.lineTo(900, 100);
  ctx.lineTo(900, 500); ctx.lineTo(0, 500); ctx.fill();

  // مباني وصناديق
  ctx.fillStyle = "#665c48";
  ctx.fillRect(30, 130, 120, 95); ctx.fillRect(735, 115, 130, 120);
  ctx.fillStyle = "#514633";
  ctx.fillRect(165, 340, 105, 55); ctx.fillRect(650, 350, 125, 50);

  // الأعداء
  for(const e of enemies){
    if(!e.alive) continue;
    e.x += e.dx;
    if(e.x < 70 || e.x > 830) e.dx *= -1;
    person(e.x, e.y, false);
    
    // علامة فوق العدو
    ctx.fillStyle = "#f13b31";
    ctx.beginPath(); ctx.moveTo(e.x, e.y - 105);
    ctx.lineTo(e.x - 10, e.y - 120); ctx.lineTo(e.x + 10, e.y - 120); ctx.fill();
  }

  // اللاعب أسفل الشاشة
  person(450, 465, true);

  // اتجاه السلاح من اللاعب للتصويب
  ctx.strokeStyle = "#fff34d"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(473, 420); ctx.lineTo(mx, my); ctx.stroke();

  // الطلقات
  for(const s of shots){
    s.x += s.dx; s.y += s.dy; s.life--;
    ctx.fillStyle = "#fff34d"; ctx.beginPath();
    ctx.arc(s.x, s.y, 5, 0, Math.PI * 2); ctx.fill();
    
    for(const e of enemies){
      if(e.alive && Math.hypot(s.x - e.x, s.y - (e.y - 55)) < 27){
        e.alive = false; s.life = 0; score += 10;playSound('hit');
        effects.push({x: e.x, y: e.y - 65, life: 30});
        
        // جزيئات الانفجار
        for(let i=0; i<15; i++){
          particles.push({
            x: e.x, y: e.y - 50,
            dx: (Math.random() - 0.5) * 8,
            dy: (Math.random() - 0.5) * 8,
            color: Math.random() > 0.5 ? '#ffd34d' : '#f13b31',
            life: 25
          });
        }
        
        message.textContent = "إصابة جامدة! 😂🔥";
        update();
        
        if(enemies.every(a => !a.alive)){
          won = true;
          playSound('win');
          message.textContent = victoryInput.value || "Fuck You Ramez! إنتي أسطورة يا نوب!";
        }
      }
    }
  }
  shots = shots.filter(s => s.life > 0 && s.x >= 0 && s.x <= 900 && s.y >= 0 && s.y <= 500);

  // تحديث الجزيئات والتأثيرات
  for(const p of particles){
    p.x += p.dx; p.y += p.dy; p.life--;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  particles = particles.filter(p => p.life > 0);

  for(const f of effects){
    f.life--;
    ctx.fillStyle = "#ffd34d"; ctx.font = "bold 28px Arial";
    ctx.fillText("💥", f.x, f.y - (30 - f.life));
  }
  effects = effects.filter(f => f.life > 0);

  // علامة التصويب المتقدمة
  ctx.strokeStyle = "#ff2929"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mx, my, 14, 0, Math.PI * 2);
  ctx.moveTo(mx - 20, my); ctx.lineTo(mx - 6, my);
  ctx.moveTo(mx + 6, my); ctx.lineTo(mx + 20, my);
  ctx.moveTo(mx, my - 20); ctx.lineTo(mx, my - 6);
  ctx.moveTo(mx, my + 6); ctx.lineTo(mx, my + 20); ctx.stroke();

  // شاشة الفوز
  if(won){
    ctx.fillStyle = "rgba(0,0,0,0.82)"; ctx.fillRect(80, 130, 740, 200);
    ctx.strokeStyle = "#ffd34d"; ctx.lineWidth = 3; ctx.strokeRect(80, 130, 740, 200);
    
    ctx.fillStyle = "#ffd34d"; ctx.textAlign = "center";
    ctx.font = "bold 36px Arial"; ctx.fillText("🎉 FUCK YOU RAMEZ 🎉", 450, 190);
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px Arial"; 
    ctx.fillText(victoryInput.value || "ضربتي التلاتة ونصرتي العدالة! 🏆", 450, 245);
    
    ctx.font = "16px Arial"; ctx.fillStyle = "#ffe16b";
    ctx.fillText("اضغطي على زر 'العبي تاني' لتكرار المتعة!", 450, 290);
    ctx.textAlign = "start";
  }

  ctx.restore();
  requestAnimationFrame(draw);
}

function fire(){
  if(won) return;
  playSound('shoot');
  const sx = 473, sy = 420;
  const dx = mx - sx, dy = my - sy, len = Math.hypot(dx, dy) || 1;
  shots.push({x: sx, y: sy, dx: dx/len * 18, dy: dy/len * 18, life: 55});
}

c.addEventListener("pointerdown", e => {
  const r = c.getBoundingClientRect();
  mx = (e.clientX - r.left) * 900 / r.width;
  my = (e.clientY - r.top) * 500 / r.height;
  fire();
});

document.getElementById("fire").onclick = fire;
document.getElementById("again").onclick = reset;

const toggleBtn = document.getElementById("toggleSound");
toggleBtn.onclick = () => {
  soundEnabled = !soundEnabled;
  toggleBtn.textContent = soundEnabled ? "🔊 الصوت: شغال" : "🔇 الصوت: مطفي";
  toggleBtn.style.background = soundEnabled ? "#445c43" : "#5c4343";
};

reset(); 
draw();
</script>

</body>
</html>
        screenShake = 8;
